services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aituber
      POSTGRES_PASSWORD: aituber
      POSTGRES_DB: aituber
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - db
      - redis
    volumes:
      - media:/var/aituber/media

volumes:
  postgres-data:
  media:
