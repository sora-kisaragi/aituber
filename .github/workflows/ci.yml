name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv pip install --system ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aituber
          POSTGRES_PASSWORD: aituber
          POSTGRES_DB: aituber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run tests
        env:
          DATABASE_URL: postgresql://aituber:aituber@localhost:5432/aituber_test
          LLM_API_KEY: dummy
          TTS_BASE_URL: http://localhost:7865
        run: pytest tests/ -v --cov=app --cov-report=term-missing
